[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "derm-context"
version = "0.1.0"
description = "Patient-separated SLICE-3D dermatology research baselines"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "xgboost>=3,<4",
  "pyarrow>=18",
  "joblib>=1.4",
  "pillow>=11",
]

[project.scripts]
derm = "derm_context.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/derm_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
